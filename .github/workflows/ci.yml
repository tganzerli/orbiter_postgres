name: ci

# The dependencies come by git tag; the PostgreSQL connector among them ships its
# native library pre-built, so no compiler is needed here, only libpq at run time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: "123"
          POSTGRES_DB: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Tests against a live server (stress suite excluded)
        # --concurrency=1: the suites create schemas and roles in one shared database.
        run: dart test --concurrency=1 -x stress
