name: orbiter_postgres
description: >
  PostgreSQL kit for orbiter: the pieces for using it together
  with slingshot_postgres (a per-request row-level-security transaction
  middleware and a prefix tsquery builder).
version: 0.1.4
publish_to: none

repository: https://github.com/tganzerli/orbiter_postgres

environment:
  sdk: ^3.6.0

dependencies:
  orbiter:
    git:
      url: https://github.com/tganzerli/orbiter
      ref: v0.1.2
  slingshot_postgres:
    git:
      url: https://github.com/tganzerli/slingshot_postgres
      ref: v0.1.4
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
